name: Hourly updater

on:
  schedule:
    - cron: '*/30 * * * *' 
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  update-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Cache sing-box binary
        id: cache-singbox
        uses: actions/cache@v3
        with:
          path: ./sing-box
          key: ${{ runner.os }}-singbox-v1.10.0
          restore-keys: |
            ${{ runner.os }}-singbox-

      - name: Install sing-box (if not cached)
        if: steps.cache-singbox.outputs.cache-hit != 'true'
        run: |
          VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/v//')
          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          curl -Lo sing-box.tar.gz "$URL"
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box .
          chmod +x sing-box
          # Сохраняем версию для кэша
          echo "$VERSION" > sing-box-version.txt

      - name: Verify sing-box exists
        run: |
          if [ ! -f "./sing-box" ]; then
            echo "❌ sing-box binary not found, downloading..."
            VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/v//')
            URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
            curl -Lo sing-box.tar.gz "$URL"
            tar -xzf sing-box.tar.gz
            mv sing-box-*/sing-box .
            chmod +x sing-box
          fi
          ./sing-box version
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Compile Rule Sets (JSON to SRS)
        run: |
          # Создаем папки для результата, если их нет
          mkdir -p ruleset/srs/block
          mkdir -p ruleset/hiddify/block

          # Компиляция основных правил (для обычного конфига)
          if [ -d "ruleset/json" ]; then
            for file in ruleset/json/*.json; do
              [ -e "$file" ] || continue
              filename=$(basename "$file" .json)
              # Проверяем, изменился ли исходный файл с момента последней компиляции
              if [ ! -f "ruleset/srs/${filename}.srs" ] || [ "$file" -nt "ruleset/srs/${filename}.srs" ]; then
                ./sing-box rule-set compile "$file" -o "ruleset/srs/${filename}.srs"
                echo "Compiled: $filename"
              else
                echo "Skipped (up to date): $filename"
              fi
            done
          fi

          # Компиляция блокирующих правил (для обычного конфига)
          if [ -d "ruleset/json/block" ]; then
            for file in ruleset/json/block/*.json; do
              [ -e "$file" ] || continue
              filename=$(basename "$file" .json)
              if [ ! -f "ruleset/srs/block/${filename}.srs" ] || [ "$file" -nt "ruleset/srs/block/${filename}.srs" ]; then
                ./sing-box rule-set compile "$file" -o "ruleset/srs/block/${filename}.srs"
                echo "Compiled block rule: $filename"
              else
                echo "Skipped (up to date): block/$filename"
              fi
            done
          fi

          # Компиляция правил для Hiddify
          if [ -d "ruleset/json/hiddify" ]; then
            for file in ruleset/json/hiddify/*.json; do
              [ -e "$file" ] || continue
              filename=$(basename "$file" .json)
              if [ ! -f "ruleset/hiddify/${filename}.srs" ] || [ "$file" -nt "ruleset/hiddify/${filename}.srs" ]; then
                ./sing-box rule-set compile "$file" -o "ruleset/hiddify/${filename}.srs"
                echo "Compiled hiddify rule: $filename"
              else
                echo "Skipped (up to date): hiddify/$filename"
              fi
            done
          fi

          # Компиляция блокирующих правил для Hiddify
          if [ -d "ruleset/json/block" ]; then
            for file in ruleset/json/block/*.json; do
              [ -e "$file" ] || continue
              filename=$(basename "$file" .json)
              if [ ! -f "ruleset/hiddify/block/${filename}.srs" ] || [ "$file" -nt "ruleset/hiddify/block/${filename}.srs" ]; then
                ./sing-box rule-set compile "$file" -o "ruleset/hiddify/block/${filename}.srs"
                echo "Compiled hiddify block rule: $filename"
              else
                echo "Skipped (up to date): hiddify/block/$filename"
              fi
            done
          fi

      - name: Run updater
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TZ_OFFSET: 3  # для MSK, можно изменить
        run: python updater.py

      - name: Get current date
        run: echo "NOW=$(TZ='Europe/Moscow' date +'%d.%m.%Y %H:%M:%S %Z')" >> $GITHUB_ENV

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Добавляем только изменённые файлы, игнорируя временные
          git add --ignore-errors config.json hiddify_config.json servers_ratings.json \
            ruleset/srs/*.srs ruleset/srs/block/*.srs \
            ruleset/hiddify/*.srs ruleset/hiddify/block/*.srs || true

          # Удаляем временные файлы, если они попали в staging
          git reset -- *.tmp 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "Авто-обновление: Конфиг и SRS правила ${{ env.NOW }}"
            git push
          fi

      - name: Cleanup temp files
        if: always()
        run: |
          rm -f *.tmp
          rm -f sing-box.tar.gz
          # Не удаляем сам sing-box, чтобы сохранить в кэше
